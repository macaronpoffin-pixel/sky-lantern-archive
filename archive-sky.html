<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Lantern Sky View - 夜空を舞うランタン</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    /* 夜空の背景（?transparent=1 指定時は透過） */
    body.sky-bg {
      background:
        radial-gradient(ellipse at 50% 100%, rgba(255, 175, 65, 0.18) 0%, rgba(255, 175, 65, 0) 58%),
        radial-gradient(ellipse at 78% 18%, rgba(85, 125, 210, 0.2) 0%, rgba(85, 125, 210, 0) 48%),
        linear-gradient(180deg, #040710 0%, #0b1326 52%, #172338 100%);
    }

    /* 星空コンテナ */
    .starfield {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .stars-far {
      position: absolute;
      inset: -10%;
      background-image:
        radial-gradient(circle 1.2px at 24px 38px, rgba(255, 255, 255, 0.9) 0, rgba(255, 255, 255, 0) 100%),
        radial-gradient(circle 1.2px at 88px 124px, rgba(255, 245, 210, 0.8) 0, rgba(255, 245, 210, 0) 100%),
        radial-gradient(circle 1.5px at 156px 64px, rgba(255, 255, 255, 0.95) 0, rgba(255, 255, 255, 0) 100%),
        radial-gradient(circle 1.2px at 214px 192px, rgba(215, 230, 255, 0.85) 0, rgba(215, 230, 255, 0) 100%),
        radial-gradient(circle 1.5px at 296px 110px, rgba(255, 232, 163, 0.9) 0, rgba(255, 232, 163, 0) 100%),
        radial-gradient(circle 1.2px at 368px 236px, rgba(255, 255, 255, 0.85) 0, rgba(255, 255, 255, 0) 100%),
        radial-gradient(circle 1.5px at 442px 52px, rgba(255, 255, 255, 0.95) 0, rgba(255, 255, 255, 0) 100%),
        radial-gradient(circle 1.2px at 520px 175px, rgba(255, 240, 195, 0.8) 0, rgba(255, 240, 195, 0) 100%);
      background-size: 560px 280px;
      opacity: 0.85;
      animation: starDrift 90s linear infinite;
    }

    .stars-twinkle-a {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle 2.2px at 72px 86px, #ffffff 0%, rgba(255, 255, 255, 0) 100%),
        radial-gradient(circle 2.4px at 230px 148px, #fff4c2 0%, rgba(255, 244, 194, 0) 100%),
        radial-gradient(circle 2px at 390px 72px, #ffffff 0%, rgba(255, 255, 255, 0) 100%),
        radial-gradient(circle 2.4px at 510px 210px, #ffd97d 0%, rgba(255, 217, 125, 0) 100%),
        radial-gradient(circle 2px at 660px 115px, #ffffff 0%, rgba(255, 255, 255, 0) 100%);
      background-size: 720px 320px;
      animation: twinkleA 3.8s ease-in-out infinite alternate;
    }

    .stars-twinkle-b {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle 2.2px at 145px 225px, #fff7d6 0%, rgba(255, 247, 214, 0) 100%),
        radial-gradient(circle 2.6px at 325px 185px, #ffffff 0%, rgba(255, 255, 255, 0) 100%),
        radial-gradient(circle 2px at 475px 95px, #ffe699 0%, rgba(255, 230, 153, 0) 100%),
        radial-gradient(circle 2.2px at 610px 255px, #ffffff 0%, rgba(255, 255, 255, 0) 100%);
      background-size: 680px 340px;
      animation: twinkleB 5.2s ease-in-out infinite alternate;
    }

    .shooting-star {
      position: absolute;
      top: 12%;
      left: 72%;
      width: 110px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.95), rgba(255, 235, 175, 0.45), rgba(255, 235, 175, 0));
      filter: drop-shadow(0 0 6px rgba(255, 245, 205, 0.85));
      opacity: 0;
      transform: rotate(-28deg);
      animation: shootingStar 9s ease-in-out infinite;
    }

    .shooting-star.star-2 {
      top: 24%;
      left: 48%;
      width: 85px;
      animation-delay: 4.5s;
      animation-duration: 11s;
    }

    @keyframes starDrift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-28px, 14px); }
    }

    @keyframes twinkleA {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    @keyframes twinkleB {
      0% { opacity: 0.9; }
      100% { opacity: 0.25; }
    }

    @keyframes shootingStar {
      0%, 82% {
        opacity: 0;
        transform: translate(0, 0) rotate(-28deg) scale(0.7);
      }
      85% {
        opacity: 1;
        transform: translate(-30px, 17px) rotate(-28deg) scale(1);
      }
      92% {
        opacity: 0;
        transform: translate(-220px, 125px) rotate(-28deg) scale(0.8);
      }
      100% {
        opacity: 0;
        transform: translate(-220px, 125px) rotate(-28deg) scale(0.8);
      }
    }

    /* 遠景の丘シルエット */
    .horizon-silhouette {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 110px;
      pointer-events: none;
      background:
        radial-gradient(ellipse 65% 90px at 20% 100%, #05070e 65%, rgba(5, 7, 14, 0) 66%),
        radial-gradient(ellipse 75% 110px at 78% 100%, #04060c 68%, rgba(4, 6, 12, 0) 69%);
      opacity: 0.92;
      z-index: 1;
    }

    /* 画面外から飛び立ち、ふわふわループし続けるランタンラッパー */
    .sky-lantern-wrapper {
      position: absolute;
      bottom: -360px;
      left: var(--start-x, 50%);
      opacity: 0;
      will-change: transform, opacity;
      z-index: 2;
      cursor: pointer;
    }

    /* 読み込み始めの初回登場：画面外下端からふわりと夜空へ放たれる演出 */
    .sky-lantern-wrapper.is-initial {
      animation: launchFromBelow var(--launch-duration, 16s) cubic-bezier(0.18, 0.72, 0.35, 1) var(--launch-delay, 0s) 1 forwards;
    }

    /* 初回登場後・または新規追加コメント：一定周期でふわふわ上昇ループ */
    .sky-lantern-wrapper.is-looping {
      animation: floatUpLoop var(--duration, 18s) linear var(--loop-delay, 0s) infinite;
    }

    .sky-lantern-wrapper:hover {
      z-index: 20;
    }

    .sky-lantern-wrapper:hover .lantern-body {
      filter: brightness(1.12);
    }

    /* 画面外からふわりと浮かび上がる初回演出 */
    @keyframes launchFromBelow {
      0% {
        transform: translateY(50px) scale(0.88);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      45% {
        transform: translateY(-52vh) scale(1);
        opacity: 0.98;
      }
      86% {
        opacity: 0.95;
      }
      100% {
        transform: translateY(-135vh) scale(1.02);
        opacity: 0;
      }
    }

    /* 定常ループ上昇 */
    @keyframes floatUpLoop {
      0% {
        transform: translateY(0);
        opacity: 0;
      }
      14% {
        opacity: 1;
      }
      85% {
        opacity: 0.96;
      }
      100% {
        transform: translateY(-135vh);
        opacity: 0;
      }
    }

    /* フローティング操作バー */
    .floating-hud {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(10, 15, 28, 0.72);
      border: 1px solid rgba(255, 215, 120, 0.35);
      backdrop-filter: blur(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .floating-hud.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
    }

    .hud-badge {
      font-size: 12px;
      font-weight: 700;
      color: #ffe28a;
      padding: 0 6px;
    }

    .hud-btn {
      background: rgba(255, 200, 70, 0.18);
      border: 1px solid rgba(255, 200, 70, 0.45);
      color: #fff5d6;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .hud-btn:hover {
      background: rgba(255, 200, 70, 0.34);
    }

    .sky-empty-notice {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      color: rgba(255, 240, 200, 0.8);
      text-align: center;
      z-index: 10;
      padding: 20px;
      line-height: 1.7;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.78);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-card {
      background: #141a26;
      border: 1px solid rgba(255, 210, 100, 0.45);
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
    }

    .modal-card .lantern-body {
      max-width: 280px;
      min-width: 200px;
      min-height: 180px;
    }

    .modal-meta {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: rgba(255, 240, 200, 0.85);
    }

    .modal-close {
      margin-top: 20px;
      width: 100%;
      padding: 8px;
    }
  </style>
</head>
<body class="sky-bg">
  <div
    id="archive-app"
    data-mode="sky"
    class="container"
    @mousemove="wakeHud"
    @click="wakeHud"
  >
    <template v-if="!isTransparent">
      <div class="starfield">
        <div class="stars-far"></div>
        <div class="stars-twinkle-a"></div>
        <div class="stars-twinkle-b"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star star-2"></div>
      </div>
      <div class="horizon-silhouette"></div>
    </template>

    <div class="floating-hud" :class="{ 'is-hidden': hudHidden }">
      <span class="hud-badge">夜空のランタン：{{ lanterns.length }}基</span>
    </div>

    <div v-if="lanterns.length === 0" class="sky-empty-notice">
      <p>まだ空に昇ったランタンがありません。</p>
    </div>

    <div
      v-for="item in skyLanterns"
      :key="item.id"
      class="sky-lantern-wrapper"
      :class="getWrapperClass(item.id)"
      :style="getSkyStyle(item)"
      @animationend="onWrapperAnimationEnd(item.id, $event)"
      @click.stop="selectedLantern = item"
    >
      <div class="lantern">
        <div class="lantern-body" :style="{ '--hue': item.hue }">
          <div class="lantern-light"></div>
          <div class="comment-content">
            <div class="comment-text" v-html="item.comment"></div>
          </div>
        </div>
        <div class="lantern-bottom"></div>
      </div>
    </div>

    <div v-if="selectedLantern" class="modal-backdrop" @click.self="selectedLantern = null">
      <div class="modal-card">
        <div class="lantern">
          <div class="lantern-body" :style="{ '--hue': selectedLantern.hue }">
            <div class="lantern-light"></div>
            <div class="comment-content">
              <div class="comment-text" v-html="selectedLantern.comment"></div>
            </div>
          </div>
          <div class="lantern-bottom"></div>
        </div>
        <div class="modal-meta">
          時刻: {{ selectedLantern.time }}
        </div>
        <button class="hud-btn modal-close" @click="selectedLantern = null">閉じる</button>
      </div>
    </div>
  </div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script type="module" src="./archive.js"></script>
</body>
</html>
</body>
</html>
